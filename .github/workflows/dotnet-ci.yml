name: Reusable workflows CI .NET

on:
  workflow_call:
    inputs:
      dotnetversion:
        description: 'Version to build'
        required: false
        default: '9.0.x'
        type: string
      artifactname:
        description: 'Artifact name'
        required: false
        default: 'app.package'
        type: string
      buildconfiguration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: string
jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get version from changelog
        id: extract-version
        run: |
          version=$(grep -oPm1 '(?<=## \[)[^\]]+' CHANGELOG.md)
          echo "Extracted version: $VERSION"
          echo "version=$version" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Muestra version
        run: |
          echo "Version: ${{ needs.extract-version.outputs.app_version }}"
      
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ github.event.inputs.dotnetversion || '9.0.x' }}
      
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{env.buildconfiguration}} --no-restore
